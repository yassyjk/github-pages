<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>市バス接近（一覧）</title>
        <style>
            body {
                background-color: #fff6f3;
                font-family: "Noto Sans JP", sans-serif;

                min-height: 80svh;
            }
            #toggleFormBtn {
                background-color: rgb(255, 160, 149);
                position: absolute;
                top: 20px;
                right: 15px;
                font-size: 22px;
                width: 40px;
                height: 40px;
                border-radius: 20px;
                border: none;
                cursor: pointer;
            }
            h2 {
                background-color: white;
                padding: 7px;
            }
            h3 {
                padding: 10px;
                margin-bottom: 0px;
                width: 100%;
            }
            #paramForm {
                background-color: #ffa095;
                display: none;
            }
            #formInput {
                padding: 0 2rem;
            }
            #addBtn {
                background-color: #feebd6;
                padding: 0.2rem 0.6rem;
                border-radius: 2px;
            }
            input {
                padding: 0.3rem;
                margin-bottom: 0.2rem;
                width: 50%;
            }
            .iframe-wrap {
                position: relative;
                width: 100%;
                padding-top: 70%;
                margin-bottom: 2rem;
                background-color: #feebd6;
                border-radius: 5px;
            }
            .iframe-wrap iframe {
                position: absolute;
                top: 50%;
                left: 50%;
                border: none;
                width: calc(97% / 0.6); /* scaleの逆数で幅を調整 */
                height: calc(97% / 0.6); /* 同じく高さを調整 */
                border: none;
                transform: translate(-50%, -50%) scale(0.6);
                border-radius: 10px;
            }
            .heading {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                font-weight: bold;
                margin-top: 0.5rem;
                padding: 0.5rem 0.5rem 0.5rem 1rem;
                background-color: #feebd6;
            }
            
            .heading span {
                margin-right: 0;
            }
            
            .heading button {
                background-color: #ffa095;
                padding: 0.3rem 0.5rem;
                border-radius: 2px;
                cursor: pointer;
            }
            
            .heading a {
                margin-left: auto;
            }

            form label {
                margin-right: 8px;
            }
            form input {
                margin-right: 12px;
            }
        </style>
    </head>
    <body>
        <button id="toggleFormBtn">＋</button>
        <h2>　市バス接近（一覧）</h2>
        <form id="paramForm" style="display: none">
            <div id="formInput">
                <h3>乗り降りバス停追加</h3>
                <label for="inputA">出発:</label>
                <input type="text" id="inputA" name="inputA" required />
                <br />
                <label for="inputB">到着:</label>
                <input type="text" id="inputB" name="inputB" required />
                <button type="button" id="addBtn">追加</button>
            </div>
        </form>

        <div id="iframeContainer"></div>

        <script>
            const toggleBtn = document.getElementById("toggleFormBtn");
            const form = document.getElementById("paramForm");

            toggleBtn.addEventListener("click", () => {
                if (form.style.display === "none") {
                    form.style.display = "block";
                } else {
                    form.style.display = "none";
                }
            });

            const STORAGE_KEY = "iframeParamsList";

            function loadParams() {
                const json = localStorage.getItem(STORAGE_KEY);
                return json ? JSON.parse(json) : [];
            }

            function saveParams(arr) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
            }

            function renderIframes() {
                const container = document.getElementById("iframeContainer");
                container.innerHTML = "";
            
                const paramsList = loadParams();
                paramsList.forEach(({ start, end }, index) => {
                    const heading = document.createElement("div");
                    heading.className = "heading";
            
                    const text = document.createElement("span");
                    text.innerText = `${start} → ${end}`;
            
                    const delBtn = document.createElement("button");
                    delBtn.type = "button";
                    delBtn.innerText = "削除";
                    delBtn.addEventListener("click", () => {
                        const currentList = loadParams();
                        currentList.splice(index, 1);
                        saveParams(currentList);
                        renderIframes();
                    });
            
                    const link = document.createElement("a");
                    link.href = `https://kotsu.city.nagoya.jp/jp/pc/bus/access.html?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}#btmMainArea`;
                    link.innerText = "公式HPへ";
                    link.target = "_blank";
            
                    heading.appendChild(text);
                    heading.appendChild(delBtn);
                    heading.appendChild(link);
                    container.appendChild(heading);
                });
            }

            document.getElementById("addBtn").addEventListener("click", () => {
                const inputA = document.getElementById("inputA").value.trim();
                const inputB = document.getElementById("inputB").value.trim();
                if (!inputA || !inputB) {
                    alert("出発と到着の両方に値を入力してください");
                    return;
                }
                const paramsList = loadParams();
                paramsList.push({ start: inputA, end: inputB });
                saveParams(paramsList);
                renderIframes();
                document.getElementById("paramForm").reset();
            });

            window.addEventListener("DOMContentLoaded", () => {
                renderIframes();
            });
        </script>
    </body>
</html>

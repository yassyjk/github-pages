        <title>市バス接近（一覧）</title>

        <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 192 192%22%3E%3Crect width=%22192%22 height=%22192%22 rx=%2236%22 fill=%22%23ffa095%22/%3E%3Crect x=%2286%22 y=%2230%22 width=%2220%22 height=%22110%22 rx=%224%22 fill=%22%23333%22/%3E%3Crect x=%2248%22 y=%2230%22 width=%2296%22 height=%2260%22 rx=%228%22 fill=%22%23fff%22 stroke=%22%23333%22 stroke-width=%224%22/%3E%3Ctext x=%2296%22 y=%2272%22 text-anchor=%22middle%22 font-size=%2232%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22%23333%22%3Eバス%3C/text%3E%3Ccircle cx=%2296%22 cy=%22160%22 r=%2214%22 fill=%22%23333%22/%3E%3C/svg%3E" />
        <style>
            * { box-sizing: border-box; }
            body {
                background-color: #fff6f3;
                font-family: "Noto Sans JP", sans-serif;
                min-height: 100svh;
                margin: 0;
                padding: 0 0 2rem;
            }
            body.dragging-active {
                overflow: hidden;
                touch-action: none;
            }
            #toggleFormBtn {
                background-color: rgb(255, 160, 149);
                position: fixed;
                top: 16px;
                right: 16px;
                font-size: 22px;
                width: 44px;
                height: 44px;
                border-radius: 22px;
                border: none;
                cursor: pointer;
                z-index: 20;
                box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            }
            h2 {
                background-color: white;
                padding: 14px 16px;
                margin: 0 0 1rem;
                padding-right: 60px;
            }
            h3 { padding: 10px 0; margin: 0 0 0.5rem; }
            #paramForm {
                background-color: #ffa095;
                display: none;
                padding-bottom: 1rem;
            }
            #formInput { padding: 0 1.5rem; }
            #addBtn, #editSaveBtn {
                background-color: #feebd6;
                padding: 0.4rem 1rem;
                border-radius: 4px;
                border: none;
                cursor: pointer;
                margin-top: 0.5rem;
                font-size: 0.95rem;
            }
            #editCancelBtn {
                background-color: #eee;
                padding: 0.4rem 1rem;
                border-radius: 4px;
                border: none;
                cursor: pointer;
                margin-top: 0.5rem;
                margin-left: 0.5rem;
            }
            input[type="text"] {
                padding: 0.4rem;
                margin-bottom: 0.4rem;
                width: 100%;
                max-width: 280px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            form label {
                display: inline-block;
                margin-right: 8px;
                min-width: 3em;
            }
            .color-options {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: 0.6rem 0 0.8rem;
            }
            .color-options label {
                display: flex;
                align-items: center;
                gap: 4px;
                cursor: pointer;
                min-width: auto;
                font-size: 0.85rem;
            }
            .color-swatch {
                width: 22px;
                height: 22px;
                border-radius: 50%;
                border: 2px solid #fff;
                box-shadow: 0 0 0 1px #ccc;
            }
            .color-options input[type="radio"] { display: none; }
            .color-options input[type="radio"]:checked + .color-swatch {
                box-shadow: 0 0 0 2px #333;
            }

            #iframeContainer {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 0.9rem;
                padding: 0 28px;
                max-width: 720px;
                margin: 0 auto;
            }
            @media (max-width: 520px) {
                #iframeContainer {
                    grid-template-columns: 1fr;
                    padding: 0 32px;
                }
            }

            .card {
                border-radius: 12px;
                padding: 1rem 1.1rem;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                display: flex;
                flex-direction: column;
                gap: 0.55rem;
                min-height: 108px;
                cursor: pointer;
                user-select: none;
                -webkit-user-select: none;
                transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
                position: relative;
                touch-action: pan-y;
            }
            .card.dragging {
                opacity: 0.9;
                transform: scale(1.04);
                box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
                z-index: 100;
                touch-action: none;
            }
            .card.drag-over {
                outline: 2px dashed #555;
                outline-offset: -2px;
            }
            .card-route {
                font-weight: bold;
                font-size: 1.05rem;
                line-height: 1.35;
                word-break: break-all;
                pointer-events: none;
            }
            .card-actions {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-top: auto;
                flex-wrap: wrap;
            }
            .card-actions button {
                background-color: rgba(0, 0, 0, 0.14);
                color: #333;
                border: none;
                padding: 0.3rem 0.55rem;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.82rem;
            }
            .card-actions button:hover {
                background-color: rgba(0, 0, 0, 0.24);
            }

            #editModal {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.45);
                z-index: 50;
                align-items: center;
                justify-content: center;
                padding: 1rem;
            }
            #editModal.show { display: flex; }
            .edit-panel {
                background: #fff6f3;
                border-radius: 14px;
                padding: 1.2rem 1.4rem;
                width: 100%;
                max-width: 360px;
                box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            }
            .edit-panel h3 { margin-top: 0; }
        </style>
    </head>
    <body>
        <button id="toggleFormBtn">＋</button>
        <h2>　市バス接近（一覧）</h2>

        <form id="paramForm" style="display: none">
            <div id="formInput">
                <h3>乗り降りバス停追加</h3>
                <label for="inputA">出発:</label>
                <input type="text" id="inputA" name="inputA" required />
                <br />
                <label for="inputB">到着:</label>
                <input type="text" id="inputB" name="inputB" required />
                <br />
                <span style="display:block; margin-top:0.6rem; font-size:0.9rem;">カードの色:</span>
                <div class="color-options" id="colorOptions"></div>
                <button type="button" id="addBtn">追加</button>
            </div>
        </form>

        <div id="iframeContainer"></div>

        <div id="editModal">
            <div class="edit-panel">
                <h3>経路を編集</h3>
                <label for="editA">出発:</label>
                <input type="text" id="editA" />
                <br />
                <label for="editB">到着:</label>
                <input type="text" id="editB" />
                <br />
                <span style="display:block; margin-top:0.6rem; font-size:0.9rem;">カードの色:</span>
                <div class="color-options" id="editColorOptions"></div>
                <button type="button" id="editSaveBtn">保存</button>
                <button type="button" id="editCancelBtn">キャンセル</button>
            </div>
        </div>

        <script>
            const COLORS = [
    { id: "red",      label: "レッド",     value: "#e74c3c" },
    { id: "orange",   label: "オレンジ",   value: "#e67e22" },
    { id: "yellow",   label: "イエロー",   value: "#f1c40f" },
    { id: "green",    label: "グリーン",   value: "#2ecc71" },
    { id: "teal",     label: "ティール",   value: "#1abc9c" },
    { id: "blue",     label: "ブルー",     value: "#3498db" },
    { id: "indigo",   label: "インディゴ", value: "#5b6abf" },
    { id: "purple",   label: "パープル",   value: "#9b59b6" },
    { id: "pink",     label: "ピンク",     value: "#e84393" },
    { id: "gray",     label: "グレー",     value: "#95a5a6" },
];

            const STORAGE_KEY = "iframeParamsList";
            let editingIndex = null;

            function buildColorOptions(container, name, selectedId) {
                container.innerHTML = "";
                COLORS.forEach((c, i) => {
                    const label = document.createElement("label");
                    const checked = (selectedId ? c.id === selectedId : i === 0) ? "checked" : "";
                    label.innerHTML = `
                        <input type="radio" name="${name}" value="${c.id}" ${checked}>
                        <span class="color-swatch" style="background-color:${c.value}"></span>
                        ${c.label}
                    `;
                    container.appendChild(label);
                });
            }
            buildColorOptions(document.getElementById("colorOptions"), "cardColor");
            buildColorOptions(document.getElementById("editColorOptions"), "editCardColor");

            const toggleBtn = document.getElementById("toggleFormBtn");
            const form = document.getElementById("paramForm");
            toggleBtn.addEventListener("click", () => {
                form.style.display = form.style.display === "none" ? "block" : "none";
            });

            function loadParams() {
                const json = localStorage.getItem(STORAGE_KEY);
                return json ? JSON.parse(json) : [];
            }
            function saveParams(arr) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
            }
            function getColorValue(colorId) {
                return (COLORS.find(c => c.id === colorId) || COLORS[0]).value;
            }

            // ========== ドラッグ＆ドロップ ==========
            let dragIndex = null;
            let longPressTimer = null;
            let isDragging = false;
            let startX = 0, startY = 0;
            let moved = false;
            let activePointerId = null;
            const LONG_PRESS_MS = 450;
            const MOVE_THRESHOLD = 10;

            function clearLongPress() {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            }

            function lockScroll() {
                document.body.classList.add("dragging-active");
            }
            function unlockScroll() {
                document.body.classList.remove("dragging-active");
            }

            // ドキュメント全体で touchmove を止める（ドラッグ中のみ）
            function preventScroll(e) {
                if (isDragging) e.preventDefault();
            }

            function onPointerDown(e, index, card) {
                if (e.target.closest("button")) return;

                activePointerId = e.pointerId;
                startX = e.clientX;
                startY = e.clientY;
                isDragging = false;
                moved = false;

                longPressTimer = setTimeout(() => {
                    isDragging = true;
                    dragIndex = index;
                    card.classList.add("dragging");
                    lockScroll();
                    try { card.setPointerCapture(e.pointerId); } catch (_) {}
                    if (navigator.vibrate) navigator.vibrate(25);
                }, LONG_PRESS_MS);
            }

            function onPointerMove(e) {
                // 別ポインタは無視
                if (activePointerId !== null && e.pointerId !== activePointerId) return;

                const dx = Math.abs(e.clientX - startX);
                const dy = Math.abs(e.clientY - startY);

                if (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD) {
                    moved = true;
                    // 長押し確定前に動いた → スクロール優先でキャンセル
                    if (!isDragging) {
                        clearLongPress();
                        return;
                    }
                }

                if (!isDragging) return;

                // ドラッグ中はスクロールを完全に止める
                e.preventDefault();
                e.stopPropagation();

                const under = document.elementFromPoint(e.clientX, e.clientY);
                const targetCard = under?.closest(".card");
                document.querySelectorAll(".card.drag-over").forEach(el => {
                    if (el !== targetCard) el.classList.remove("drag-over");
                });
                if (targetCard && !targetCard.classList.contains("dragging")) {
                    targetCard.classList.add("drag-over");
                }
            }

            function finishDrag(e) {
                clearLongPress();
                const card = e.currentTarget;

                if (!isDragging) {
                    if (!e.target.closest("button") && !moved && card?.dataset.url) {
                        window.open(card.dataset.url, "_blank", "noopener,noreferrer");
                    }
                    activePointerId = null;
                    return;
                }

                const under = document.elementFromPoint(e.clientX, e.clientY);
                const targetCard = under?.closest(".card");

                document.querySelectorAll(".card").forEach(el => {
                    el.classList.remove("dragging", "drag-over");
                });
                unlockScroll();

                if (targetCard && dragIndex !== null) {
                    const toIndex = Number(targetCard.dataset.index);
                    if (toIndex !== dragIndex && !isNaN(toIndex)) {
                        const list = loadParams();
                        const [item] = list.splice(dragIndex, 1);
                        list.splice(toIndex, 0, item);
                        saveParams(list);
                        renderIframes();
                    }
                }
                isDragging = false;
                dragIndex = null;
                activePointerId = null;
            }

            function onPointerCancel(e) {
                clearLongPress();
                document.querySelectorAll(".card").forEach(el => {
                    el.classList.remove("dragging", "drag-over");
                });
                unlockScroll();
                isDragging = false;
                dragIndex = null;
                activePointerId = null;
            }

            // ========== 編集 ==========
            const editModal = document.getElementById("editModal");

            function openEdit(index) {
                const list = loadParams();
                const item = list[index];
                if (!item) return;
                editingIndex = index;
                document.getElementById("editA").value = item.start;
                document.getElementById("editB").value = item.end;
                buildColorOptions(document.getElementById("editColorOptions"), "editCardColor", item.color || "coral");
                editModal.classList.add("show");
            }

            document.getElementById("editSaveBtn").addEventListener("click", () => {
                const start = document.getElementById("editA").value.trim();
                const end = document.getElementById("editB").value.trim();
                if (!start || !end) {
                    alert("出発と到着の両方に値を入力してください");
                    return;
                }
                const color = document.querySelector('input[name="editCardColor"]:checked')?.value || "coral";
                const list = loadParams();
                list[editingIndex] = { start, end, color };
                saveParams(list);
                editModal.classList.remove("show");
                editingIndex = null;
                renderIframes();
            });

            document.getElementById("editCancelBtn").addEventListener("click", () => {
                editModal.classList.remove("show");
                editingIndex = null;
            });
            editModal.addEventListener("click", (e) => {
                if (e.target === editModal) {
                    editModal.classList.remove("show");
                    editingIndex = null;
                }
            });

            // ========== 描画 ==========
            function renderIframes() {
                const container = document.getElementById("iframeContainer");
                container.innerHTML = "";
                const paramsList = loadParams();

                paramsList.forEach(({ start, end, color }, index) => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.style.backgroundColor = getColorValue(color || "coral");
                    card.dataset.index = index;
                    card.dataset.url = `https://kotsu.city.nagoya.jp/jp/pc/bus/access.html?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}#btmMainArea`;

                    const route = document.createElement("div");
                    route.className = "card-route";
                    route.innerText = `${start} → ${end}`;

                    const actions = document.createElement("div");
                    actions.className = "card-actions";

                    const editBtn = document.createElement("button");
                    editBtn.type = "button";
                    editBtn.innerText = "編集";
                    editBtn.addEventListener("click", (ev) => {
                        ev.stopPropagation();
                        openEdit(index);
                    });

                    const delBtn = document.createElement("button");
                    delBtn.type = "button";
                    delBtn.innerText = "削除";
                    delBtn.addEventListener("click", (ev) => {
                        ev.stopPropagation();
                        if (confirm("削除してよいですか？")) {
                            const list = loadParams();
                            list.splice(index, 1);
                            saveParams(list);
                            renderIframes();
                        }
                    });

                    actions.appendChild(editBtn);
                    actions.appendChild(delBtn);
                    card.appendChild(route);
                    card.appendChild(actions);

                    // passive: false で preventDefault を有効化
                    card.addEventListener("pointerdown", (e) => onPointerDown(e, index, card));
                    card.addEventListener("pointermove", onPointerMove, { passive: false });
                    card.addEventListener("pointerup", finishDrag);
                    card.addEventListener("pointercancel", onPointerCancel);
                    card.addEventListener("pointerleave", () => {
                        if (!isDragging) clearLongPress();
                    });

                    container.appendChild(card);
                });
            }

            // ドキュメントレベルでも touchmove を監視（iOS対策）
            document.addEventListener("touchmove", preventScroll, { passive: false });

            document.getElementById("addBtn").addEventListener("click", () => {
                const inputA = document.getElementById("inputA").value.trim();
                const inputB = document.getElementById("inputB").value.trim();
                if (!inputA || !inputB) {
                    alert("出発と到着の両方に値を入力してください");
                    return;
                }
                const selectedColor = document.querySelector('input[name="cardColor"]:checked')?.value || "coral";
                const list = loadParams();
                list.push({ start: inputA, end: inputB, color: selectedColor });
                saveParams(list);
                renderIframes();
                document.getElementById("inputA").value = "";
                document.getElementById("inputB").value = "";
            });

            if ("serviceWorker" in navigator) {
                const swCode = `
                    const CACHE = "bus-approach-v1";
                    self.addEventListener("install", () => self.skipWaiting());
                    self.addEventListener("activate", (e) => e.waitUntil(clients.claim()));
                    self.addEventListener("fetch", (e) => {
                        e.respondWith(
                            caches.open(CACHE).then(async (cache) => {
                                try {
                                    const res = await fetch(e.request);
                                    if (e.request.method === "GET" && res.ok) cache.put(e.request, res.clone());
                                    return res;
                                } catch {
                                    return (await cache.match(e.request)) || Response.error();
                                }
                            })
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: "application/javascript" });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            }

            window.addEventListener("DOMContentLoaded", renderIframes);
        </script>
    </body>
</html>

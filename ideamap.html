<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>アイデアマップ</title>
    <style>
      body {
        font-family: sans-serif;
      }
      .node-edit {
        width: 150px;
        font-size: 18px;
        padding: 2px;
      }
      .mindmap-svg {
        border: 1px solid #ccc;
        background: #f9f9f9;
        display: block;
      }
      .mindmap-container {
        width: 100vw;
        height: 100vh;
        overflow: auto;
        box-sizing: border-box;
      }
      .node-group:hover {
        filter: drop-shadow(0 2px 2px #92b398);
      }
      .node-btn {
        cursor: pointer;
        font-size: 18px;
        background: #fff;
        border: 1px solid #aaa;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        line-height: 20px;
        text-align: center;
        user-select: none;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .collapse-circle {
        cursor: pointer;
        stroke: #888;
        stroke-width: 2;
        transition: fill 0.2s;
      }
      .collapse-circle.has-children {
        fill: #888;
      }
      .export-import-bar {
        margin-bottom: 10px;
      }
      button {
        margin: 5px;
        padding: 5px 10px;
      }
    </style>
  </head>
  <body>
    <h3>アイデアマップ</h3>
    <div id="app-container"></div>

    <!-- ReactとBabel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      // 初期ツリー定義
      const initialTreeData = {
        root: {
          id: 1,
          name: "初期表示",
          collapsed: false,
          children: [
            {
              id: 2,
              name: "子1",
              collapsed: false,
              children: [
                { id: 3, name: "孫1-1", collapsed: false, children: [] },
              ],
            },
            {
              id: 4,
              name: "子2",
              collapsed: false,
              children: [
                { id: 5, name: "孫2-1", collapsed: false, children: [] },
              ],
            },
          ],
        },
      };

      // ツリー全体から最大IDを取得するヘルパー関数
      function getMaxId(node) {
        let maxId = node.id;
        for (const child of node.children || []) {
          maxId = Math.max(maxId, getMaxId(child));
        }
        return maxId;
      }

      function getSubtreeHeight(node, nodeHeight = 60, nodeGap = 20) {
        if (
          !node ||
          node.collapsed ||
          !node.children ||
          node.children.length === 0
        )
          return nodeHeight;
        const total = node.children
          .map((child) => getSubtreeHeight(child, nodeHeight, nodeGap))
          .reduce((a, b) => a + b, 0);
        return total + nodeGap * (node.children.length - 1);
      }

      function layoutTree(
        node,
        x,
        y,
        positions = {},
        parent = null,
        nodeHeight = 60,
        nodeGap = 20,
        isRoot = false,
        xOffset = 150
      ) {
        if (!node) return positions;

        if (
          isRoot &&
          node.children &&
          node.children.length > 0 &&
          !node.collapsed
        ) {
          let childYs = [];
          let childY = 0;
          node.children.forEach((child) => {
            layoutTree(
              child,
              x + xOffset,
              childY,
              positions,
              node,
              nodeHeight,
              nodeGap,
              false,
              xOffset
            );
            childYs.push(positions[child.id].y);
            childY += getSubtreeHeight(child, nodeHeight, nodeGap) + nodeGap;
          });
          const maxY = childYs.length > 0 ? Math.max(...childYs) : 0;
          y = maxY / 2;
          positions[node.id] = { x, y, node, parent };
        } else if (
          isRoot &&
          node.children &&
          node.children.length > 0 &&
          node.collapsed
        ) {
          positions[node.id] = { x, y, node, parent };
        } else {
          positions[node.id] = { x, y, node, parent };
          if (!node.collapsed && node.children && node.children.length > 0) {
            let childY = isRoot ? 0 : y;
            node.children.forEach((child) => {
              layoutTree(
                child,
                x + xOffset,
                childY,
                positions,
                node,
                nodeHeight,
                nodeGap,
                false,
                xOffset
              );
              const childSubtreeHeight = getSubtreeHeight(
                child,
                nodeHeight,
                nodeGap
              );
              childY += childSubtreeHeight + nodeGap;
            });
          }
        }
        return positions;
      }

      function CollapseCircle({ x, y, hasChildren, collapsed, onClick }) {
        let fillColor = "#fff";
        if (hasChildren) fillColor = collapsed ? "limegreen" : "#888";
        return (
          <circle
            cx={x}
            cy={y}
            r={9}
            className="collapse-circle"
            fill={fillColor}
            onClick={hasChildren ? onClick : undefined}
          />
        );
      }

      function MindMapNode({
        node,
        pos,
        onEdit,
        onAdd,
        onDelete,
        onToggle,
        editingId,
        setEditingId,
      }) {
        const [tempName, setTempName] = React.useState(node.name || "");

        React.useEffect(() => {
          setTempName(node.name || "");
        }, [node.name, editingId]);

        const circleX = 0,
          circleY = 0;

        return (
          <g className="node-group" transform={`translate(${pos.x},${pos.y})`}>
            <CollapseCircle
              x={circleX}
              y={circleY}
              hasChildren={node.children && node.children.length > 0}
              collapsed={node.collapsed}
              onClick={(e) => {
                e.stopPropagation();
                if (node.children && node.children.length > 0)
                  onToggle(node.id);
              }}
            />
            {editingId === node.id ? (
              <foreignObject x={-50} y={15} width={170} height={30}>
                <input
                  className="node-edit"
                  type="text"
                  value={tempName}
                  onChange={(e) => setTempName(e.target.value)}
                  onBlur={() => {
                    onEdit(node.id, tempName.trim() === "" ? "空" : tempName);
                    setEditingId(null);
                  }}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") {
                      onEdit(node.id, tempName.trim() === "" ? "空" : tempName);
                      setEditingId(null);
                    }
                  }}
                  autoFocus
                />
              </foreignObject>
            ) : (
              <text
                x={0}
                y={35}
                textAnchor="middle"
                style={{ cursor: "pointer", fontSize: "16px" }}
                onClick={() => setEditingId(node.id)}
              >
                {node.name}
              </text>
            )}
            <foreignObject x={25} y={-10} width={30} height={50}>
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  justifyContent: "flex-start",
                  height: "50px",
                }}
              >
                <div
                  className="node-btn add"
                  title="子追加"
                  onClick={(e) => {
                    e.stopPropagation();
                    onAdd(node.id);
                  }}
                >
                  ＋
                </div>
                {pos.parent && (
                  <div
                    className="node-btn del"
                    title="削除"
                    onClick={(e) => {
                      e.stopPropagation();
                      onDelete(node.id);
                    }}
                  >
                    －
                  </div>
                )}
              </div>
            </foreignObject>
          </g>
        );
      }

      function MindMapLinks({ positions }) {
        const lines = [];
        Object.values(positions).forEach((pos) => {
          if (pos.parent) {
            const parentPos = positions[pos.parent.id];
            lines.push(
              <line
                key={pos.node.id}
                x1={parentPos.x}
                y1={parentPos.y}
                x2={pos.x}
                y2={pos.y}
                stroke="#bbb"
                strokeWidth={2}
              />
            );
          }
        });
        return <g>{lines}</g>;
      }

      function editNode(node, id, fn) {
        if (node.id === id) return fn(node);
        return {
          ...node,
          children: (node.children || []).map((child) =>
            editNode(child, id, fn)
          ),
        };
      }

      function deleteNode(node, id) {
        return {
          ...node,
          children: (node.children || [])
            .filter((child) => child.id !== id)
            .map((child) => deleteNode(child, id)),
        };
      }

      function MindMapApp() {
        // 初期rootデータを取得
        const getSavedRoot = () => {
          try {
            const saved = localStorage.getItem("mindmapTemp");
            if (saved) {
              const data = JSON.parse(saved);
              if (data && data.root) {
                return data.root;
              }
            }
          } catch (e) {
            console.error("Failed to load from localStorage:", e);
          }
          return JSON.parse(JSON.stringify(initialTreeData.root));
        };

        // 初期nextNodeIdを計算
        const getInitialNextNodeId = () => {
          try {
            const saved = localStorage.getItem("mindmapTemp");
            if (saved) {
              const data = JSON.parse(saved);
              if (data && data.root) {
                return getMaxId(data.root) + 1;
              }
            }
          } catch (e) {
            console.error("Failed to calculate nextNodeId:", e);
          }
          return getMaxId(initialTreeData.root) + 1;
        };

        const [root, setRoot] = React.useState(getSavedRoot());
        const [nextNodeId, setNextNodeId] = React.useState(
          getInitialNextNodeId()
        );
        const [editingId, setEditingId] = React.useState(null);
        const [isMobile, setIsMobile] = React.useState(
          window.matchMedia("(max-width: 767px)").matches
        );

        // ノードを生成する関数
        const createNode = React.useCallback(
          (name = "項目", children = [], collapsed = false) => {
            const newId = nextNodeId;
            setNextNodeId((prev) => prev + 1);
            return {
              id: newId,
              name,
              children: children || [],
              collapsed,
            };
          },
          [nextNodeId]
        );

        React.useEffect(() => {
          const handler = () => {
            setIsMobile(window.matchMedia("(max-width: 767px)").matches);
          };
          window.addEventListener("resize", handler);
          return () => window.removeEventListener("resize", handler);
        }, []);

        const handleEdit = React.useCallback((id, newName) => {
          setRoot((prev) =>
            editNode(prev, id, (node) => ({ ...node, name: newName }))
          );
        }, []);

        const handleAdd = React.useCallback(
          (id) => {
            setRoot((prev) =>
              editNode(prev, id, (node) => ({
                ...node,
                children: [...(node.children || []), createNode("項目")],
              }))
            );
          },
          [createNode]
        );

        const handleDelete = React.useCallback(
          (id) => {
            if (root.id === id) return;
            if (window.confirm("本当にこのノードを削除しますか？")) {
              setRoot((prev) => deleteNode(prev, id));
            }
          },
          [root.id]
        );

        const handleToggle = React.useCallback((id) => {
          setRoot((prev) =>
            editNode(prev, id, (node) => ({
              ...node,
              collapsed: !node.collapsed,
            }))
          );
        }, []);

        // エクスポート処理
        const handleExport = React.useCallback(() => {
          const exportObj = { nextNodeId, root };
          const blob = new Blob([JSON.stringify(exportObj, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "mindmap.json";
          a.click();
          URL.revokeObjectURL(url);
        }, [nextNodeId, root]);

        // インポート処理
        const handleImport = React.useCallback((event) => {
          const file = event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const data = JSON.parse(evt.target.result);
              if (data && data.root) {
                const maxId = getMaxId(data.root);
                setNextNodeId(Math.max(data.nextNodeId || 0, maxId + 1));
                setRoot(data.root);
                localStorage.setItem(
                  "mindmapTemp",
                  JSON.stringify({
                    nextNodeId: Math.max(data.nextNodeId || 0, maxId + 1),
                    root: data.root,
                  })
                );
              } else {
                alert("不正なデータです");
              }
            } catch (err) {
              alert("読み込み失敗: " + err);
            }
          };
          reader.readAsText(file);
          // ファイル選択をリセット
          event.target.value = null;
        }, []);

        // PNGとしてエクスポート処理
        const handleExportPNG = React.useCallback(() => {
          const svgElem = document.querySelector(".mindmap-svg");
          if (!svgElem) {
            alert("SVGが見つかりません");
            return;
          }

          // SVGをシリアライズ
          const serializer = new XMLSerializer();
          let source = serializer.serializeToString(svgElem);

          // SVGにxmlns属性を追加（必要な場合）
          if (
            !source.match(/^<svg[^>]+xmlns="http:\/\/www\.w3\.org\/2000\/svg"/)
          ) {
            source = source.replace(
              /^<svg/,
              '<svg xmlns="http://www.w3.org/2000/svg"'
            );
          }

          // SVGデータを画像として読み込む
          const svg64 = btoa(unescape(encodeURIComponent(source)));
          const image64 = "data:image/svg+xml;base64," + svg64;

          const img = new window.Image();
          // SVGのサイズを取得
          const width = svgElem.width.baseVal.value || 800;
          const height = svgElem.height.baseVal.value || 600;
          img.onload = function () {
            // Canvasを作成
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            // 背景白
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            // PNGとしてダウンロード
            canvas.toBlob((blob) => {
              if (blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "mindmap.png";
                a.click();
                URL.revokeObjectURL(url);
              }
            }, "image/png");
          };
          img.onerror = function () {
            alert("画像変換に失敗しました");
          };
          img.src = image64;
        }, []);

        // 一時保存処理
        const handleSaveTemp = React.useCallback(() => {
          const tempData = { nextNodeId, root };
          localStorage.setItem("mindmapTemp", JSON.stringify(tempData));
          alert("一時保存しました！");
        }, [nextNodeId, root]);

        // 一時保存から再開処理
        const handleResume = React.useCallback(() => {
          const saved = localStorage.getItem("mindmapTemp");
          if (saved) {
            try {
              const data = JSON.parse(saved);
              if (data && data.root) {
                const maxId = getMaxId(data.root);
                setNextNodeId(Math.max(data.nextNodeId || 0, maxId + 1));
                setRoot(data.root);
                setTimeout(() => {
                  alert("保存データを読み込みました！");
                }, 100);
              } else {
                alert("保存データが不正です");
              }
            } catch (err) {
              alert("読み込み失敗: " + err);
            }
          } else {
            alert("保存されたデータが見つかりません");
          }
        }, []);

        // 新規作成処理
        const handleNew = React.useCallback(() => {
          if (
            window.confirm(
              "新規作成します。現在の内容は失われます。よろしいですか？"
            )
          ) {
            const initialRoot = JSON.parse(
              JSON.stringify(initialTreeData.root)
            );
            setNextNodeId(getMaxId(initialRoot) + 1);
            setRoot(initialRoot);
          }
        }, []);

        // SVGのレイアウト計算
        const nodeHeight = 60;
        const nodeGap = 20;
        const totalTreeHeight = getSubtreeHeight(root, nodeHeight, nodeGap);
        const rootY = totalTreeHeight / 2;
        const xOffset = isMobile ? 130 : 170;

        const positions = layoutTree(
          root,
          50,
          rootY,
          {},
          null,
          nodeHeight,
          nodeGap,
          true,
          xOffset
        );

        // SVGのサイズ計算（防御的に）
        const yValues = Object.values(positions).map((pos) => pos.y);
        const minY = yValues.length ? Math.min(...yValues, 0) : 0;
        const maxY = yValues.length ? Math.max(...yValues, 0) : 0;
        const svgHeight = Math.max(maxY - minY + 130, 200); // 最小高さを確保
        const yOffset = -minY + 50;

        const xValues = Object.values(positions).map((pos) => pos.x);
        const maxX = xValues.length ? Math.max(...xValues, 0) : 0;
        const svgWidth = Math.max(maxX + 120, 300); // 最小幅を確保

        return (
          <>
            <div className="export-import-bar">
              <button onClick={handleExport}>エクスポートして保存</button>
              <input
                type="file"
                id="import-input"
                accept=".json"
                style={{ display: "none" }}
                onChange={handleImport}
              />
              <button
                onClick={() => document.getElementById("import-input").click()}
              >
                インポート
              </button>
              <button onClick={handleExportPNG}>PNG画像で保存</button>
              <br />
              <button onClick={handleSaveTemp}>一時保存</button>
              <button onClick={handleResume}>一時保存から再開</button>
              <br />
              <button onClick={handleNew}>新規</button>
            </div>
            <div className="mindmap-container">
              <svg width={svgWidth} height={svgHeight} className="mindmap-svg">
                <g transform={`translate(0,${yOffset})`}>
                  <MindMapLinks positions={positions} />
                  {Object.values(positions).map((pos) => (
                    <MindMapNode
                      key={pos.node.id}
                      node={pos.node}
                      pos={{ ...pos, y: pos.y }}
                      onEdit={handleEdit}
                      onAdd={handleAdd}
                      onDelete={handleDelete}
                      onToggle={handleToggle}
                      editingId={editingId}
                      setEditingId={setEditingId}
                    />
                  ))}
                </g>
              </svg>
            </div>
          </>
        );
      }

      const root = ReactDOM.createRoot(
        document.getElementById("app-container")
      );
      root.render(<MindMapApp />);
    </script>
  </body>
</html>

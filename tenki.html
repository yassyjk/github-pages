<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>天気予報</title>
        <style>
            :root {
                --bg-gray: #f2f2f7;
                --card-white: #ffffff;
                --accent-blue: #007aff;
                --temp-red: #ff3b30;
                --text-main: #1c1c1e;
                --text-sub: #8e8e93;
            }
            body {
                font-family: -apple-system, "Helvetica Neue", sans-serif;
                background-color: var(--bg-gray);
                margin: 0;
                padding: 15px 12px;
                color: var(--text-main);
                line-height: 1.3;
            }
            .container {
                max-width: 430px;
                margin: 0 auto;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
                padding: 0 5px;
            }
            h1 {
                font-size: 1.5rem;
                margin: 0;
                font-weight: 800;
                letter-spacing: -0.5px;
            }
            .settings-btn {
                background: none;
                border: none;
                font-size: 1.4rem;
                cursor: pointer;
                padding: 5px;
            }
            .controls {
                display: flex;
                gap: 10px;
                margin-bottom: 15px;
            }
            select {
                flex: 1;
                padding: 12px 15px;
                border-radius: 12px;
                border: none;
                font-size: 16px;
                font-weight: 700;
                background: var(--card-white);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
                appearance: none;
                color: var(--text-main);
            }
            .refresh-btn {
                padding: 0 18px;
                border-radius: 12px;
                background: var(--accent-blue);
                color: white;
                border: none;
                font-weight: bold;
                font-size: 14px;
            }
            /* 天気カード */
            .day-card {
                background: var(--card-white);
                border-radius: 20px;
                padding: 15px 10px;
                margin-bottom: 12px;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
            }
            .day-header {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-bottom: 10px;
                padding: 0 6px;
            }
            .day-label {
                font-size: 1.2rem;
                font-weight: 800;
                color: var(--accent-blue);
            }
            .day-date {
                font-size: 0.9rem;
                color: var(--text-sub);
                font-weight: 600;
            }
            .time-row {
                display: flex;
                justify-content: space-between;
                gap: 6px;
            }
            .time-slot {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 12px 2px;
                background: #f8f9fb;
                border-radius: 16px;
                min-height: 135px; /* 中間の高さ */
            }
            .slot-time {
                font-size: 0.75rem;
                color: var(--text-sub);
                font-weight: 700;
                margin-bottom: 5px;
            }
            .slot-icon {
                font-size: 2rem;
                margin-bottom: 2px;
            }
            .slot-weather {
                font-size: 0.7rem;
                font-weight: bold;
                margin-bottom: 8px;
                color: #444;
            }
            .slot-temp {
                font-size: 1.4rem;
                font-weight: 900;
                color: var(--temp-red);
                margin-bottom: 2px;
            }
            .slot-prec {
                font-size: 0.7rem;
                color: var(--accent-blue);
                font-weight: 600;
            }
            /* モーダル */
            #settingsModal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(2px);
                z-index: 1000;
                justify-content: center;
                align-items: center;
            }
            .modal-content {
                background: white;
                padding: 25px;
                border-radius: 22px;
                width: 80%;
                max-width: 300px;
                text-align: center;
            }
            .modal-content input {
                width: 100%;
                padding: 12px;
                margin: 15px 0;
                border-radius: 10px;
                border: 1px solid #ddd;
                font-size: 16px;
                box-sizing: border-box;
            }
            .save-btn {
                background: var(--accent-blue);
                color: white;
                border: none;
                padding: 12px;
                border-radius: 10px;
                font-weight: bold;
                width: 100%;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>今日・明日の天気</h1>
                <button class="settings-btn" onclick="toggleModal()">⚙️</button>
            </header>

            <div class="controls">
                <select id="areaSelect" onchange="loadWeather()">
                    <option value="hashima" selected>📍 岐阜県 羽島市</option>
                    <option value="nagoya">📍 愛知県 名古屋市</option>
                </select>
                <button class="refresh-btn" onclick="loadWeather()">
                    更新
                </button>
            </div>

            <div id="weather-info"></div>
        </div>

        <div id="settingsModal">
            <div class="modal-content">
                <h3>名前の設定</h3>
                <input
                    type="text"
                    id="nicknameInput"
                    placeholder="ニックネームを入力"
                />
                <button class="save-btn" onclick="saveSettings()">
                    設定を保存
                </button>
            </div>
        </div>

        <script>
            const GAS_URL = "https://script.google.com/macros/s/AKfycbymjTtYbFxdprnS5dmPzcwWTrJH9FnEdEtZuShzpXUsf_7HCyTC9f1uxXqhTsjdRLJn/exec"; // GASのURLを入力してください

            const locations = {
                hashima: { lat: 35.31, lng: 136.7 },
                nagoya: { lat: 35.18, lng: 136.91 },
            };

            const weatherCodeMap = {
                0: "☀️ 晴天",
                1: "🌤 晴れ",
                2: "⛅ 曇り",
                3: "☁️ 曇り",
                45: "🌫 霧",
                48: "🌫 濃霧",
                51: "🌦 小雨",
                53: "🌧 弱雨",
                55: "🌧 雨",
                61: "🌦 小雨",
                63: "🌧 雨",
                65: "🌊 大雨",
                80: "🌦 にわか雨",
                95: "⚡ 雷雨",
            };

            window.onload = function () {
                const savedName = localStorage.getItem("userNickname");
                if (savedName) {
                    document.getElementById("nicknameInput").value = savedName;
                }
                loadWeather();
                pushLineMessage();
            };

            function toggleModal() {
                const modal = document.getElementById("settingsModal");
                modal.style.display =
                    modal.style.display === "flex" ? "none" : "flex";
            }

            function saveSettings() {
                const name = document.getElementById("nicknameInput").value;
                localStorage.setItem("userNickname", name);
                toggleModal();
            }

            async function pushLineMessage() {
                if (!GAS_URL) return;
                const nickname =
                    localStorage.getItem("userNickname") || "未設定のユーザー";
                const message = `${nickname}さんが天気アプリを開きました。`;
                try {
                    await fetch(
                        `${GAS_URL}?message=${encodeURIComponent(message)}`,
                        {
                            method: "POST",
                            mode: "no-cors",
                            cache: "no-cache",
                        },
                    );
                } catch (e) {
                    console.error(e);
                }
            }

            async function loadWeather() {
                const sel = document.getElementById("areaSelect").value;
                const loc = locations[sel];
                const infoDiv = document.getElementById("weather-info");
                infoDiv.innerHTML =
                    "<p style='text-align:center; padding:20px; font-size:14px;'>取得中...</p>";

                const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lng}&hourly=temperature_2m,precipitation,weather_code&timezone=Asia/Tokyo`;

                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    const h = data.hourly;
                    const today = new Date().toLocaleDateString("sv-SE");
                    const tomorrow = new Date(
                        Date.now() + 86400000,
                    ).toLocaleDateString("sv-SE");

                    infoDiv.innerHTML = "";
                    infoDiv.appendChild(createCard("今日", today, h));
                    infoDiv.appendChild(createCard("明日", tomorrow, h));
                } catch (error) {
                    infoDiv.innerHTML =
                        "<p style='text-align:center; color:red; padding:20px;'>エラー</p>";
                }
            }

            function createCard(label, dateStr, data) {
                const card = document.createElement("div");
                card.className = "day-card";
                const displayDate = dateStr
                    .replace(/^\d{4}-/, "")
                    .replace("-", "/");
                card.innerHTML = `<div class="day-header"><span class="day-label">${label}</span><span class="day-date">${displayDate}</span></div>`;
                const row = document.createElement("div");
                row.className = "time-row";
                const targetHours = [8, 13, 18];
                let htmlContent = "";

                data.time.forEach((t, i) => {
                    const d = new Date(t);
                    const hour = d.getHours();
                    if (t.startsWith(dateStr) && targetHours.includes(hour)) {
                        const weatherData =
                            weatherCodeMap[data.weather_code[i]] || "☁️ 曇り";
                        const [icon, text] = weatherData.split(" ");
                        htmlContent += `
                            <div class="time-slot">
                                <div class="slot-time">${hour}:00</div>
                                <div class="slot-icon">${icon}</div>
                                <div class="slot-weather">${text}</div>
                                <div class="slot-temp">${Math.round(data.temperature_2m[i])}°</div>
                                <div class="slot-prec">💧${data.precipitation[i]}<small>mm</small></div>
                            </div>`;
                    }
                });
                row.innerHTML = htmlContent;
                card.appendChild(row);
                return card;
            }
        </script>
    </body>
</html>
